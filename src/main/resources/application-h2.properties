# H2 Local Profile for standalone development
spring.datasource.url=jdbc:h2:mem:carcrowd_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.sql.init.mode=never

app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
app.jwt.secret=CarCrowdSecureProductionJwtSecretKey2025ForAdminAuthenticationAndRoleAuthorization!
app.jwt.expiration-ms=86400000
app.google.client-id=${GOOGLE_CLIENT_ID:carcrowd-google-client-id.apps.googleusercontent.com}
